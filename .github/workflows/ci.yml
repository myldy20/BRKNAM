name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DBRKNAM_BUILD_TESTS=ON -DBRKNAM_BUILD_TOOLS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  nam-core-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Configure NAM Core adapter
        run: >-
          cmake -S . -B build-nam
          -DBRKNAM_ENABLE_NAM_CORE=ON
          -DBRKNAM_BUILD_TESTS=ON
          -DBRKNAM_BUILD_TOOLS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build NAM Core adapter
        run: cmake --build build-nam --config Release
      - name: Test NAM Core adapter
        run: >-
          ctest --test-dir build-nam -C Release
          --output-on-failure -L nam-core

  iplug2-shell-build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            targets: BRKNAM-app BRKNAM-vst3 BRKNAM-au
          - os: windows-latest
            targets: BRKNAM-app BRKNAM-vst3
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - name: Configure iPlug2 shell
        run: >-
          cmake -S . -B build-plugin
          -DBRKNAM_ENABLE_IPLUG2=ON
          -DBRKNAM_BUILD_TESTS=OFF
          -DBRKNAM_BUILD_TOOLS=OFF
          -DIPLUG_DEPLOY_PLUGINS=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build iPlug2 shell
        run: >-
          cmake --build build-plugin --config Release
          --target ${{ matrix.targets }}
      - name: Configure Steinberg validator
        run: >-
          cmake
          -S build-plugin/_deps/brknam_iplug2_source-src/Dependencies/IPlug/VST3_SDK
          -B build-validator
          -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=OFF
          -DSMTG_ENABLE_VST3_HOSTING_EXAMPLES=ON
          -DSMTG_ENABLE_VSTGUI_SUPPORT=OFF
          -DCMAKE_BUILD_TYPE=Release
      - name: Build Steinberg validator
        run: cmake --build build-validator --config Release --target validator
      - name: Validate VST3 on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          validator="$(find build-validator -type f -name validator -perm -111 -print -quit)"
          plugin="$(find build-plugin/out -type d -name BRKNAM.vst3 -print -quit)"
          test -n "$validator"
          test -n "$plugin"
          "$validator" "$plugin"
      - name: Validate VST3 on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $validator = Get-ChildItem build-validator -Recurse -File -Filter validator.exe | Select-Object -First 1
          $plugin = Get-ChildItem build-plugin/out -Recurse -Directory -Filter BRKNAM.vst3 | Select-Object -First 1
          if (-not $validator) { throw "Steinberg validator.exe was not built" }
          if (-not $plugin) { throw "BRKNAM.vst3 bundle was not built" }
          & $validator.FullName $plugin.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate Audio Unit on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          component="$(find build-plugin/out -type d -name BRKNAM.component -print -quit)"
          test -n "$component"
          codesign --force --deep --sign - "$component"
          destination="$HOME/Library/Audio/Plug-Ins/Components/BRKNAM.component"
          mkdir -p "$(dirname "$destination")"
          rm -rf "$destination"
          cp -R "$component" "$destination"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx BrNm Myld
